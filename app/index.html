<!doctype html>
<!-- Lesen & Verstehen – Lese-App für Kinder · @ Joschy -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lesen & Verstehen</title>
<style>
@font-face { font-family: "Andika"; src: url(fonts/andika-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Andika"; src: url(fonts/andika-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Nunito"; src: url(fonts/nunito-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Nunito"; src: url(fonts/nunito-latin-900-normal.woff2) format("woff2"); font-weight: 900; }

:root {
  --bg: #F4EEE3; --paper: #FFFDF8; --ink: #26252E; --ink-soft: #5E5B66; --line: #E4DCCD;
  --teal: #157A7A; --teal-soft: #DDF0EE; --mark: #FFE27A;
  --ok: #2E9A57; --ok-soft: #DDF3E4; --bad: #D2493F; --bad-soft: #FBE3E0;
  --s1: #3E9B5F; --s1-soft: #E2F2E6; --s2: #2F7FC1; --s2-soft: #E1EDF8; --s3: #8A55C2; --s3-soft: #EEE5F8;
  --star: #F2B705; --coin: #E9A800; --radius: 22px; --textsize: 27px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font-family: "Nunito", system-ui, sans-serif; font-weight: 700; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px; font-size: 22px; font-weight: 900; white-space: nowrap; }
.pill .st { color: var(--star); font-size: 26px; }
.pill.coins { color: #8A5F00; }
.coin { display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF2A8 0 18%, #FFD23F 19% 55%, #E9A800 56%); box-shadow: inset 0 0 0 2px #C98F00; vertical-align: -0.15em; position: relative; }
.coin::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; border: 2px solid rgba(201,143,0,.55); }
.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* ── Übersicht ── */
.home-head { display: flex; align-items: center; gap: 18px; padding: 20px 36px 6px; }
.me { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; background: var(--teal-soft); border: 4px solid var(--paper); box-shadow: 0 0 0 3px var(--teal); flex: none; position: relative; }
.me svg { width: 100%; height: 100%; display: block; }
.home-head h1 { margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.5px; }
.home-head .sub { color: var(--ink-soft); font-size: 19px; margin-top: 2px; }
.head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.iconbtn { width: 52px; height: 52px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); font-size: 24px; }
.shopbtn { white-space: nowrap; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #8A55C2, #5B3FB5); color: #fff; border-radius: 18px; padding: 12px 20px; font-size: 21px; font-weight: 900; box-shadow: 0 4px 0 #3E2A85; }
.shopbtn .ic { font-size: 26px; }
.tabs { display: flex; gap: 14px; padding: 12px 36px 14px; }
.tab { flex: 1; border-radius: 18px; padding: 12px 18px; background: var(--paper); border: 3px solid var(--line); display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 900; transition: transform .1s; }
.tab small { display: block; font-size: 16px; font-weight: 700; color: var(--ink-soft); }
.tab .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 22px; flex: none; }
.tab[data-s="1"] .dot { background: var(--s1); } .tab[data-s="2"] .dot { background: var(--s2); } .tab[data-s="3"] .dot { background: var(--s3); }
.tab.on[data-s="1"] { border-color: var(--s1); background: var(--s1-soft); }
.tab.on[data-s="2"] { border-color: var(--s2); background: var(--s2-soft); }
.tab.on[data-s="3"] { border-color: var(--s3); background: var(--s3-soft); }
.tab .prog { margin-left: auto; font-size: 18px; color: var(--ink-soft); }
.grid { flex: 1; overflow-y: auto; padding: 4px 36px 24px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-content: start; }
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 20px; padding: 14px 10px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-height: 170px; box-shadow: 0 3px 0 var(--line); transition: transform .1s; position: relative; }
.card:active, .tab:active, .btn:active, .ans:active, .tile:active, .shopbtn:active, .me:active { transform: scale(.97); }
.card .em { font-size: 46px; line-height: 1.1; font-family: "Nunito", sans-serif; }
.card .t { font-size: 17px; line-height: 1.2; font-weight: 900; flex: 1; display: flex; align-items: center; }
.card .stars { font-size: 22px; letter-spacing: 2px; color: #D9D2C4; }
.card .stars .y { color: var(--star); }
.card.done { border-color: #E9D78F; background: #FFFBEA; }
.card.perfect::after { content: "👑"; position: absolute; top: -10px; right: -6px; font-size: 26px; transform: rotate(14deg); }
.card .nr { position: absolute; top: 8px; left: 10px; font-size: 13px; color: #B5AC9C; }
.foot { text-align: center; padding: 0 0 10px; }
.foot button { color: var(--ink-soft); font-size: 14px; text-decoration: underline; opacity: .6; }
.foot .by { color: var(--ink-soft); font-size: 13px; opacity: .45; margin-left: 14px; }
.home-head h1 { cursor: pointer; }

/* ── Profil ── */
#profil { position: fixed; inset: 0; z-index: 35; display: none; overflow-y: auto; background: var(--bg); }
#profil.on { display: block; }
.pf { max-width: 980px; margin: 0 auto; padding: 22px 36px 40px; display: flex; flex-direction: column; gap: 16px; }
.pf-head { display: flex; align-items: center; gap: 16px; }
.pf-head .big { font-size: 58px; line-height: 1; }
.pf-head h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -0.5px; }
.pf-head .sub { color: var(--ink-soft); font-size: 19px; margin-top: 2px; }
.pf-card { background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius); padding: 20px 26px; box-shadow: 0 3px 0 var(--line); }
.pf-card label { display: block; font-size: 25px; font-weight: 900; margin-bottom: 12px; }
.pf-card label .n { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 20px; margin-right: 10px; vertical-align: 2px; }
#pfName { width: 100%; font-family: "Andika", sans-serif; font-weight: 700; font-size: 32px; color: var(--ink); background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 14px 20px; outline: none; user-select: text; -webkit-user-select: text; }
#pfName:focus { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
#pfName::placeholder { color: #C2B9A8; }
.ages { display: flex; gap: 12px; }
.age { flex: 1; height: 84px; border-radius: 20px; background: #fff; border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); font-size: 36px; font-weight: 900; transition: transform .1s, background .2s, border-color .2s; }
.age:active { transform: scale(.95); }
.age.on { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 4px 0 #0E5656; }
.pf-hint { color: var(--ink-soft); font-size: 17px; margin-top: 10px; }
.pf-btns { display: flex; gap: 14px; justify-content: flex-end; align-items: center; }
.pf-btns .btn { font-size: 26px; padding: 18px 40px; }

/* ── Lesen ── */
.bar { display: flex; align-items: center; gap: 14px; padding: 12px 24px; }
.back { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 10px 20px; font-size: 20px; font-weight: 900; }
.bar h2 { margin: 0; font-size: 27px; font-weight: 900; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { border-radius: 999px; padding: 6px 16px; font-size: 17px; font-weight: 900; color: #fff; }
.size { display: flex; gap: 8px; }
.size button { width: 54px; height: 50px; border-radius: 14px; background: var(--paper); border: 2px solid var(--line); font-family: "Andika", sans-serif; font-weight: 700; }
.size button:first-child { font-size: 18px; } .size button:last-child { font-size: 28px; }
.split { flex: 1; display: flex; gap: 20px; padding: 0 24px 22px; min-height: 0; }
.textpane { flex: 1.3; background: var(--paper); border-radius: var(--radius); border: 2px solid var(--line); overflow-y: auto; padding: 32px 44px 60px; position: relative; scroll-behavior: smooth; }
.textpane .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.textpane .head .em { font-size: 44px; }
.textpane .head h3 { margin: 0; font-family: "Andika", sans-serif; font-size: calc(var(--textsize) * 1.2); font-weight: 700; }
.txt p { font-family: "Andika", sans-serif; font-weight: 400; font-size: var(--textsize); line-height: 1.75; margin: 0 0 .85em; word-spacing: .06em; letter-spacing: .01em; }
.w { border-radius: 6px; padding: 1px 0; transition: background .25s, box-shadow .25s; }
.w.hint { background: var(--mark); box-shadow: 0 0 0 3px var(--mark); }
.w.found { background: var(--ok-soft); box-shadow: 0 0 0 3px var(--ok-soft); }
.tapmode .w { cursor: pointer; border-bottom: 2px dotted #B9B0A0; }
.w.tapbad { background: var(--bad-soft); box-shadow: 0 0 0 3px var(--bad-soft); animation: shake .35s; }
.w.tapok { background: var(--ok); color: #fff; box-shadow: 0 0 0 4px var(--ok); transition: none; }

.qpane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.qcard { flex: 1; background: var(--paper); border-radius: var(--radius); border: 2px solid var(--line); padding: 26px 30px; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
.dots { display: flex; gap: 8px; margin-bottom: 16px; }
.dots i { flex: 1; height: 10px; border-radius: 5px; background: var(--line); }
.dots i.ok { background: var(--ok); } .dots i.retry { background: var(--star); } .dots i.cur { background: var(--teal); }
.qnum { color: var(--ink-soft); font-size: 18px; margin-bottom: 8px; display: flex; justify-content: space-between; }
.qtext { font-family: "Andika", sans-serif; font-size: 29px; line-height: 1.4; font-weight: 700; margin-bottom: 22px; }
.answers { display: flex; flex-direction: column; gap: 14px; }
.answers.yn { flex-direction: row; }
.ans { display: flex; align-items: center; gap: 16px; text-align: left; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 14px 20px; font-family: "Andika", sans-serif; font-size: 24px; line-height: 1.3; min-height: 74px; box-shadow: 0 3px 0 var(--line); transition: transform .1s, background .2s, border-color .2s; }
.ans .k { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 22px; }
.answers.yn .ans { flex: 1; justify-content: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 30px; min-height: 120px; flex-direction: column; gap: 4px; }
.answers.yn .ans .ic { font-size: 40px; }
.ans.ok { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.ans.ok .k { background: var(--ok); color: #fff; }
.ans.bad { background: var(--bad-soft); border-color: var(--bad); box-shadow: none; opacity: .75; animation: shake .35s; pointer-events: none; }
.ans.bad .k { background: var(--bad); color: #fff; }
.locked .ans { pointer-events: none; }
.tapinfo { display: flex; align-items: center; gap: 16px; background: var(--teal-soft); border-radius: 18px; padding: 20px 22px; font-size: 22px; color: var(--teal); }
.tapinfo .ic { font-size: 44px; animation: nudge 1.2s infinite; }
.fb { margin-top: auto; padding-top: 16px; }
.msg { border-radius: 18px; padding: 14px 20px; font-size: 21px; display: flex; align-items: center; gap: 14px; }
.msg.ok { background: var(--ok-soft); color: #1E6E3D; }
.msg.bad { background: #FFF4CC; color: #7A5A00; }
.msg .ic { font-size: 32px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--teal); color: #fff; border-radius: 18px; padding: 18px 28px; font-size: 24px; font-weight: 900; box-shadow: 0 4px 0 #0E5656; transition: transform .1s; }
.btn.wide { width: 100%; margin-top: 12px; }
.btn.light { background: var(--paper); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.gold { background: linear-gradient(180deg, #FFD23F, #E9A800); color: #5A3E00; box-shadow: 0 4px 0 #B07D00; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.start { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; padding: 10px; }
.start .big { font-size: 76px; }
.start h4 { margin: 0; font-size: 30px; font-weight: 900; }
.start p { margin: 0; font-size: 21px; color: var(--ink-soft); line-height: 1.45; max-width: 420px; }
.start .reward { font-size: 18px; color: #8A5F00; background: #FFF4CC; border-radius: 14px; padding: 10px 16px; }
.floatcoin { position: fixed; z-index: 30; pointer-events: none; font-size: 30px; font-weight: 900; color: #B07D00; text-shadow: 0 2px 0 #fff; animation: floatup 1.1s ease-out forwards; }
@keyframes floatup { from { transform: translateY(0) scale(.8); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.15); } to { transform: translateY(-70px) scale(1); opacity: 0; } }

.result { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; }
.result .bigstars { font-size: 66px; letter-spacing: 6px; color: #DDD5C6; }
.result .bigstars .y { color: var(--star); display: inline-block; animation: pop .5s backwards; }
.result .bigstars .y:nth-child(2) { animation-delay: .2s; } .result .bigstars .y:nth-child(3) { animation-delay: .4s; }
.result h4 { margin: 0; font-size: 32px; font-weight: 900; }
.result p { margin: 0; font-size: 20px; color: var(--ink-soft); }
.earn { background: #FFF7D6; border: 2px solid #F3DE8A; border-radius: 18px; padding: 10px 18px; width: 100%; max-width: 380px; }
.earn .tot { font-size: 30px; font-weight: 900; color: #8A5F00; }
.earn .ln { font-size: 16px; color: #8A6A1F; display: flex; justify-content: space-between; }
.result .col { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; width: 100%; max-width: 380px; }
.result .row { display: flex; gap: 10px; } .result .row .btn { flex: 1; padding: 14px 10px; font-size: 20px; }

/* ── Held & Shop ── */
.herowrap { flex: 1; display: flex; gap: 20px; padding: 0 24px 22px; min-height: 0; }
.stage { width: 420px; flex: none; background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; padding: 16px; position: relative; overflow: hidden; }
.stage .av { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage .av svg { height: 100%; max-width: 100%; border-radius: 18px; }
.stage .tag { position: absolute; top: 28px; left: 28px; background: #8A55C2; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 16px; font-weight: 900; display: none; }
.stage .tag.on { display: block; }
.trophies { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; min-height: 40px; }
.trophies span { font-size: 26px; width: 40px; height: 40px; display: grid; place-items: center; background: #FFF7D6; border-radius: 12px; }
.trophies span.no { filter: grayscale(1); opacity: .25; background: #EEE7DA; }
.shop { flex: 1; display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius); min-width: 0; overflow: hidden; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 16px 10px; border-bottom: 2px solid var(--line); }
.slotchip { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: #F4EEE3; font-size: 17px; font-weight: 900; border: 2px solid transparent; }
.slotchip.on { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
.items { flex: 1; overflow-y: auto; padding: 14px 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-content: start; }
.tile { background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 6px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; transition: transform .1s; }
.tile .th { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: #F1EBDF; display: grid; place-items: center; }
.tile .th svg { width: 100%; height: 100%; }
.tile .th .none { font-size: 40px; opacity: .5; }
.tile .nm { font-size: 15px; font-weight: 900; text-align: center; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
.tile .pr { font-size: 16px; font-weight: 900; color: #8A5F00; display: flex; align-items: center; gap: 5px; }
.tile .pr.owned { color: var(--ok); }
.tile .pr.poor { color: #B9A88A; }
.tile.sel { border-color: #8A55C2; box-shadow: 0 0 0 3px #E6DAF5; }
.tile.eq { border-color: var(--ok); }
.tile.eq::after { content: "✓"; position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 17px; }
.tile.locked .th { filter: saturate(.75); }
.actbar { border-top: 2px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 14px; min-height: 84px; }
.actbar .what { flex: 1; font-size: 20px; font-weight: 900; }
.actbar .what small { display: block; font-size: 15px; color: var(--ink-soft); font-weight: 700; }
.actbar .btn { padding: 14px 22px; font-size: 21px; }

/* ── Feier-Overlay ── */
#party { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(43,31,94,.82), rgba(12,10,30,.94)); }
#party.on { display: flex; }
#party canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pbox { position: relative; display: flex; align-items: center; gap: 30px; color: #fff; }
.pbox .bigav { width: 300px; height: 390px; }
.pbox .bigav svg { width: 100%; height: 100%; border-radius: 26px; box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 20px 60px rgba(0,0,0,.4); }
.pinfo { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; max-width: 470px; }
.ptitle { font-size: 74px; font-weight: 900; letter-spacing: 2px; line-height: 1; display: flex; }
.ptitle span { display: inline-block; animation: wave 1.2s ease-in-out infinite; background: linear-gradient(180deg, #FFF2A8, #FFB703); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
.psub { font-size: 24px; opacity: .95; }
.pcoins { font-size: 44px; font-weight: 900; color: #FFD23F; display: flex; align-items: center; gap: 12px; }
.ptro { display: flex; flex-direction: column; gap: 8px; }
.ptro div { background: rgba(255,255,255,.12); border-radius: 14px; padding: 8px 14px; font-size: 20px; display: flex; align-items: center; gap: 10px; animation: pop .5s backwards; }
.ptro div b { font-size: 28px; }
.trophyspin { font-size: 64px; animation: spinin 1s backwards; display: inline-block; }
@keyframes spinin { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }
@keyframes wave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

/* Avatar-Animationen */
.avatar * { transform-box: view-box; }
.av-eyes { transform-origin: 100px 96px; animation: blink 4.5s infinite; }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.av-twinkle { animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.av-glow { animation: twinkle 2.2s ease-in-out infinite; }
.av-flap { transform-origin: 100px 160px; animation: flap 1.4s ease-in-out infinite; }
@keyframes flap { 50% { transform: scaleY(.93) translateY(6px); } }
.av-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .35s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scaleY(.85); } to { transform: scaleY(1.12); } }
.av-bob { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.av-orbit { transform-origin: 100px 90px; animation: orbit 6s linear infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
.av-float { animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-10px); } }
.av-flash { animation: flash 1.2s steps(2) infinite; }
@keyframes flash { 50% { opacity: .3; } }
.av-bubbles { animation: bubbles 4s linear infinite; }
@keyframes bubbles { from { transform: translateY(20px); opacity: .2; } 30% { opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
.av-snow { animation: snow 5s linear infinite; }
@keyframes snow { from { transform: translateY(-20px); } to { transform: translateY(40px); } }
.av-blink-light { animation: twinkle .8s steps(2) infinite; }
.avatar.dance .av-body { transform-origin: 100px 250px; animation: dance .9s ease-in-out infinite; }
.avatar.dance .av-armL { transform-origin: 56px 146px; animation: wavearm .45s ease-in-out infinite alternate; }
@keyframes dance { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-16px) rotate(-4deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-16px) rotate(4deg); } }
@keyframes wavearm { from { transform: rotate(10deg); } to { transform: rotate(150deg); } }
.avatar.hop .av-body { transform-origin: 100px 250px; animation: hop .6s ease-out; }
@keyframes hop { 40% { transform: translateY(-18px) scale(1.03); } }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
@keyframes nudge { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-10px)} }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
.confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; pointer-events: none; animation: fall linear forwards; z-index: 45; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.coinrain { position: fixed; top: -40px; pointer-events: none; z-index: 45; font-size: 34px; animation: fall linear forwards; }

@media (max-width: 1150px) { .grid { grid-template-columns: repeat(5, 1fr); } .stage { width: 360px; } .items { grid-template-columns: repeat(3, 1fr); } }
@media (max-height: 720px) { .qtext { font-size: 25px; } .ans { min-height: 62px; font-size: 22px; } .answers.yn .ans { min-height: 100px; } }
</style>
</head>
<body>

<section class="screen" id="home">
  <div class="home-head">
    <button class="me" id="meBtn" aria-label="Mein Held"></button>
    <div>
      <h1 id="hello" role="button" title="Profil ändern">Hallo! 📚</h1>
      <div class="sub">Lies genau und sammle Münzen für deinen Helden.</div>
    </div>
    <div class="head-right">
      <span class="pill"><span class="st">★</span><span id="totalStars">0</span></span>
      <span class="pill coins" id="coinPill"><span class="coin"></span><span id="coinNum">0</span></span>
      <button class="shopbtn" id="shopBtn"><span class="ic">🛍️</span>Mein Held</button>
      <button class="iconbtn" id="soundBtn" aria-label="Ton an/aus">🔊</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="foot"><button id="reset">Fortschritt zurücksetzen</button><span class="by">@ Joschy</span></div>
</section>

<section class="screen" id="read">

    <button class="back" id="backBtn">← Übersicht</button>
    <h2 id="rTitle"></h2>
    <span class="pill coins"><span class="coin"></span><span id="coinNum2">0</span></span>
    <span class="badge" id="rBadge"></span>
    <div class="size"><button id="smaller" aria-label="Schrift kleiner">A</button><button id="bigger" aria-label="Schrift größer">A</button></div>
  </div>
  <div class="split">

      <div class="head"><span class="em" id="rEmoji"></span><h3 id="rH"></h3></div>
      <div class="txt" id="txt"></div>
    </div>
    <div class="qpane"><div class="qcard" id="qcard"></div></div>
  </div>
</section>

<section class="screen" id="hero">
  <div class="bar">
    <button class="back" id="heroBack">← Übersicht</button>
    <h2>Mein Held</h2>
    <span class="pill coins" id="coinPill3"><span class="coin"></span><span id="coinNum3">0</span></span>
  </div>
  <div class="herowrap">
    <div class="stage">
      <span class="tag" id="tryTag">Anprobieren</span>
      <div class="av" id="heroAv"></div>
      <div class="trophies" id="trophies"></div>
    </div>
    <div class="shop">
      <div class="slots" id="slots"></div>
      <div class="items" id="items"></div>
      <div class="actbar" id="actbar"></div>
    </div>
  </div>
</section>

<div id="profil">
  <div class="pf">
    <div class="pf-head"><span class="big">👋</span><div><h1 id="pfTitle">Willkommen!</h1><div class="sub" id="pfSub">Schön, dass du da bist! Erzähl uns kurz etwas über dich.</div></div></div>
    <div class="pf-card">
      <label for="pfName"><span class="n">1</span>Wie heißt du?</label>
      <input id="pfName" type="text" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Dein Name">
    </div>
    <div class="pf-card">
      <label><span class="n">2</span>Wie alt bist du?</label>
      <div class="ages" id="pfAges"></div>
      <div class="pf-hint" id="pfHint">Danach suchen wir passende Texte für dich aus.</div>
    </div>
    <div class="pf-btns">
      <button class="btn light" id="pfCancel">Abbrechen</button>
      <button class="btn" id="pfOk" disabled>Los geht's! 🚀</button>
    </div>
  </div>
</div>

<div id="party"><canvas id="fw"></canvas><div class="pbox" id="pbox"></div></div>

<script src="content.js"></script>
<script src="content2.js"></script>
<script src="content3.js"></script>
<script src="content4.js"></script>
<script src="avatar.js"></script>
<script>
(function () {
  "use strict";
  var TEXTE = window.TEXTE.slice().sort(function (a, b) { return a.id - b.id; });
  var A = window.AVATAR;
  var STUFEN = { 1: "leicht", 2: "mittel", 3: "schwer" };
  var KEY = "vishwa-lesen-v1";
  var LOB = ["Super, richtig!", "Klasse!", "Genau!", "Sehr gut gelesen!", "Prima!", "Richtig, toll!", "Stark!", "Spitze!", "Volltreffer!"];

  // ── Speicher ──
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  var store = load();
  var hadOld = !!(store.stars && Object.keys(store.stars).length) || store.coins !== undefined;
  store.stars = store.stars || {};
  store.stufe = store.stufe || 1;
  store.size = store.size || 27;
  if (typeof store.coins !== "number") {
    var had = 0; for (var k0 in store.stars) had += store.stars[k0];
    store.coins = 30 + had * 5;          // Startguthaben (+ Bonus für schon gesammelte Sterne)
  }
  store.owned = store.owned || [];
  store.equip = store.equip || {};
  store.perfect = store.perfect || {};
  store.trophies = store.trophies || [];
  if (store.sound === undefined) store.sound = true;
  save();

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(w) { return w.toLowerCase().replace(/[^0-9a-zäöüß\-]/g, ""); }
  function starsHtml(n) { var s = ""; for (var i = 0; i < 3; i++) s += i < n ? '<span class="y">★</span>' : "★"; return s; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var COIN = '<span class="coin"></span>';
  document.documentElement.style.setProperty("--textsize", store.size + "px");

  // ── Töne ──
  var ac = null;
  function tone(f, d, type, when, vol) {
    if (!store.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
    } catch (e) {}
  }
  var sfx = {
    ok: function () { tone(660, .14, "sine", 0); tone(990, .22, "sine", .09); },
    bad: function () { tone(240, .22, "triangle", 0, .12); },
    coin: function () { tone(1320, .08, "square", 0, .05); tone(1760, .16, "square", .07, .05); },
    buy: function () { [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, .18, "triangle", i * .07, .12); }); },
    fanfare: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, .22, "triangle", i * .13, .16); }); [523, 659, 784, 1047].forEach(function (f) { tone(f, .9, "sine", .6, .09); }); },
    tap: function () { tone(520, .06, "sine", 0, .06); }
  };

  // ── Münzen ──
  function showCoins(bump) {
    ["coinNum", "coinNum2", "coinNum3"].forEach(function (id) { $(id).textContent = store.coins; });
    if (bump) ["coinPill", "coinPill3"].concat([]).forEach(function (id) { var el = $(id); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); });
  }
  function addCoins(n, el) {
    if (!n) return;
    store.coins += n; save(); showCoins(true);
    if (el) {
      var r = el.getBoundingClientRect(), f = document.createElement("div");
      f.className = "floatcoin"; f.innerHTML = "+" + n + " " + COIN;
      f.style.left = (r.left + r.width / 2 - 30) + "px"; f.style.top = (r.top - 10) + "px";
      document.body.appendChild(f); setTimeout(function () { f.remove(); }, 1200);
    }
    sfx.coin();
  }

  // ── Pokale ──
  function doneCount() { var n = 0; for (var k in store.stars) if (store.stars[k]) n++; return n; }
  function perfCount() { var n = 0; for (var k in store.perfect) if (store.perfect[k]) n++; return n; }
  function stufeDone(s) { return TEXTE.filter(function (t) { return t.stufe === s; }).every(function (t) { return store.stars[t.id]; }); }
  var TROPHIES = [
    { id: "t1", icon: "📘", name: "Erster Text geschafft", bonus: 10, test: function () { return doneCount() >= 1; } },
    { id: "p1", icon: "⭐", name: "Erstes Mal perfekt", bonus: 15, test: function () { return perfCount() >= 1; } },
    { id: "t10", icon: "📚", name: "10 Texte gelesen", bonus: 30, test: function () { return doneCount() >= 10; } },
    { id: "p10", icon: "🌟", name: "10 Texte perfekt", bonus: 50, test: function () { return perfCount() >= 10; } },
    { id: "t25", icon: "🏅", name: "25 Texte gelesen", bonus: 60, test: function () { return doneCount() >= 25; } },
    { id: "s1", icon: "🟢", name: "Stufe 1 komplett", bonus: 80, test: function () { return stufeDone(1); } },
    { id: "t50", icon: "🥈", name: "50 Texte gelesen", bonus: 100, test: function () { return doneCount() >= 50; } },
    { id: "p30", icon: "💫", name: "30 Texte perfekt", bonus: 120, test: function () { return perfCount() >= 30; } },
    { id: "s2", icon: "🔵", name: "Stufe 2 komplett", bonus: 120, test: function () { return stufeDone(2); } },
    { id: "t75", icon: "🥇", name: "75 Texte gelesen", bonus: 150, test: function () { return doneCount() >= 75; } },
    { id: "s3", icon: "🟣", name: "Stufe 3 komplett", bonus: 160, test: function () { return stufeDone(3); } },
    { id: "p60", icon: "👑", name: "60 Texte perfekt", bonus: 200, test: function () { return perfCount() >= 60; } },
    { id: "all", icon: "🏆", name: "Alle " + TEXTE.length + " Texte!", bonus: 300, test: function () { return doneCount() >= TEXTE.length; } }
  ];
  function checkTrophies() {
    var got = [];
    TROPHIES.forEach(function (t) { if (store.trophies.indexOf(t.id) < 0 && t.test()) { store.trophies.push(t.id); store.coins += t.bonus; got.push(t); } });
    if (got.length) save();
    return got;
  }

  // ── Figur ──
  function owns(id) { var it = A.BY[id]; return !it || it.price === 0 || store.owned.indexOf(id) >= 0; }
  function heroSvg(extraEq, opt) { var e = {}; for (var k in store.equip) e[k] = store.equip[k]; if (extraEq) for (var k2 in extraEq) e[k2] = extraEq[k2]; return A.render(e, opt); }

  // ── Profil ──
  function pname() { return store.profile && store.profile.name ? store.profile.name : ""; }
  var pfAge = null, pfEdit = false;
  (function () { var h = ""; for (var a = 6; a <= 12; a++) h += '<button class="age" data-a="' + a + '">' + a + "</button>"; $("pfAges").innerHTML = h; })();
  function pfCheck() {
    var ok = $("pfName").value.trim().length > 0 && pfAge !== null;
    $("pfOk").disabled = !ok;
    var bs = document.querySelectorAll("#pfAges .age"); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", +bs[i].dataset.a === pfAge);
  }
  function openProfile(edit) {
    pfEdit = !!edit;
    var p = store.profile || {};
    $("pfTitle").textContent = pfEdit ? "Mein Profil" : "Willkommen!";
    $("pfSub").textContent = pfEdit ? "Hier kannst du deinen Namen und dein Alter ändern." : "Schön, dass du da bist! Erzähl uns kurz etwas über dich.";
    $("pfName").value = p.name || (!pfEdit && hadOld ? "Vishva" : "");
    pfAge = p.age || null;
    $("pfCancel").style.display = pfEdit ? "" : "none";
    $("pfOk").innerHTML = pfEdit ? "Speichern ✓" : "Los geht's! 🚀";
    $("profil").classList.add("on"); $("profil").scrollTop = 0;
    pfCheck();
  }
  function closeProfile() { $("profil").classList.remove("on"); $("pfName").blur(); }
  $("pfName").addEventListener("input", pfCheck);
  $("pfName").addEventListener("focus", function () {
    // Bildschirmtastatur: Feld nach oben holen, damit es sichtbar bleibt
    setTimeout(function () { try { $("pfName").scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) {} }, 300);
  });
  $("pfName").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("pfName").blur(); } });
  $("pfAges").addEventListener("click", function (e) { var b = e.target.closest(".age"); if (!b) return; sfx.tap(); pfAge = +b.dataset.a; pfCheck(); });
  $("pfCancel").onclick = function () { sfx.tap(); closeProfile(); };
  $("pfOk").onclick = function () {
    var name = $("pfName").value.trim().slice(0, 20);
    if (!name || pfAge === null) return;
    var isNew = !store.profile;
    store.profile = { name: name, age: pfAge };
    if (isNew && !hadOld) store.stufe = pfAge <= 10 ? 1 : 2;
    save(); sfx.ok(); closeProfile(); renderHome();
  };
  $("hello").onclick = function () { sfx.tap(); openProfile(true); };

  // ── Übersicht ──
  function renderHome() {
    $("hello").innerHTML = "Hallo " + esc(pname()) + "! 📚";
    var total = 0; for (var k in store.stars) total += store.stars[k];
    $("totalStars").textContent = total;
    showCoins();
    $("soundBtn").textContent = store.sound ? "🔊" : "🔇";
    $("meBtn").innerHTML = heroSvg(null, { viewBox: "38 38 124 124", noBg: false });
    var tabs = "";
    [1, 2, 3].forEach(function (s) {
      var list = TEXTE.filter(function (t) { return t.stufe === s; });
      var done = list.filter(function (t) { return store.stars[t.id]; }).length;
      tabs += '<button class="tab' + (s === store.stufe ? " on" : "") + '" data-s="' + s + '"><span class="dot">' + s + '</span><span>Stufe ' + s + "<small>" + STUFEN[s] + '</small></span><span class="prog">' + done + "/" + list.length + "</span></button>";
    });
    $("tabs").innerHTML = tabs;
    var html = "", n = 0;
    TEXTE.filter(function (t) { return t.stufe === store.stufe; }).forEach(function (t) {
      var st = store.stars[t.id] || 0; n++;
      html += '<button class="card' + (st ? " done" : "") + (st === 3 ? " perfect" : "") + '" data-id="' + t.id + '"><span class="nr">' + n + '</span><span class="em">' + t.emoji + '</span><span class="t">' + esc(t.titel) + '</span><span class="stars">' + starsHtml(st) + "</span></button>";
    });
    $("grid").innerHTML = html;
  }
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    sfx.tap(); store.stufe = +b.dataset.s; save(); renderHome(); $("grid").scrollTop = 0;
  });
  $("grid").addEventListener("click", function (e) {
    var c = e.target.closest(".card"); if (!c) return;
    sfx.tap(); location.hash = "#/t/" + c.dataset.id;
  });
  $("meBtn").onclick = $("shopBtn").onclick = function () { sfx.tap(); location.hash = "#/held"; };
  $("soundBtn").onclick = function () { store.sound = !store.sound; save(); renderHome(); sfx.tap(); };
  $("reset").addEventListener("click", function () {
    if (confirm("Wirklich alle Sterne löschen? (Münzen und Figur bleiben.)")) { store.stars = {}; store.perfect = {}; save(); renderHome(); }
  });

  // ── Lesen & Fragen ──
  var cur = null, st = null;

  function renderText(t) {
    var html = "";
    t.text.forEach(function (p, pi) {
      var out = "", re = /\S+/g, m, last = 0;
      while ((m = re.exec(p))) {
        out += esc(p.slice(last, m.index));
        out += '<span class="w" data-p="' + pi + '" data-s="' + m.index + '" data-e="' + (m.index + m[0].length) + '">' + esc(m[0]) + "</span>";
        last = m.index + m[0].length;
      }
      html += "<p>" + out + "</p>";
    });
    $("txt").innerHTML = html;
  }
  function clearMarks() { var ws = document.querySelectorAll(".w.hint, .w.found, .w.tapbad, .w.tapok"); for (var i = 0; i < ws.length; i++) ws[i].classList.remove("hint", "found", "tapbad", "tapok"); }
  function clearHint() { var ws = document.querySelectorAll(".w.hint"); for (var i = 0; i < ws.length; i++) ws[i].classList.remove("hint"); }
  function mark(h, cls) {
    var first = null;
    cur.text.forEach(function (p, pi) {
      var idx = p.indexOf(h); if (idx < 0) return;
      var end = idx + h.length, ws = document.querySelectorAll('.w[data-p="' + pi + '"]');
      for (var i = 0; i < ws.length; i++) { var s = +ws[i].dataset.s, e = +ws[i].dataset.e; if (s < end && e > idx) { ws[i].classList.add(cls); if (!first) first = ws[i]; } }
    });
    if (first) { var pane = $("textpane"); pane.scrollTop = Math.max(0, first.offsetTop - pane.clientHeight / 3); }
  }

  function openText(id) {
    var cf = document.querySelectorAll(".confetti,.coinrain"); for (var ci = 0; ci < cf.length; ci++) cf[ci].remove();
    cur = TEXTE.filter(function (t) { return t.id === id; })[0];
    if (!cur) { location.hash = "#/"; return; }
    $("rTitle").textContent = cur.titel; $("rH").textContent = cur.titel; $("rEmoji").textContent = cur.emoji;
    $("rBadge").textContent = "Stufe " + cur.stufe; $("rBadge").style.background = "var(--s" + cur.stufe + ")";
    renderText(cur); $("textpane").scrollTop = 0;
    var repeat = !!store.stars[cur.id];
    st = { i: -1, results: [], tries: 0, done: false, repeat: repeat, earned: 0 };
    showCoins();
    showStart();
  }

  function dots() {
    var h = '<div class="dots">';
    for (var i = 0; i < cur.fragen.length; i++) { var c = st.results[i] === 1 ? "ok" : st.results[i] === 0 ? "retry" : i === st.i ? "cur" : ""; h += '<i class="' + c + '"></i>'; }
    return h + "</div>";
  }
  function showStart() {
    $("txt").classList.remove("tapmode");
    var rw = st.repeat ? "Wiederholung: 1 " + COIN + " pro richtige Antwort beim ersten Versuch." : "Für jede richtige Antwort bekommst du 3 " + COIN + " – und bei „perfekt“ einen Extra-Bonus!";
    $("qcard").innerHTML = '<div class="start"><div class="big">📖</div><h4>Lies zuerst den Text.</h4>' +
      "<p>Lies in Ruhe – gern auch zweimal. Wenn du ein Wort nicht kennst, frag Papa oder Mama.</p>" +
      '<div class="reward">' + rw + "</div>" +
      '<button class="btn" id="go">Gelesen – los geht\'s! →</button></div>';
    $("go").onclick = function () { sfx.tap(); st.i = 0; showQ(); };
  }

  function showQ() {
    clearMarks(); st.tries = 0;
    var f = cur.fragen[st.i];
    var h = dots() + '<div class="qnum"><span>Frage ' + (st.i + 1) + " von " + cur.fragen.length + "</span></div>";
    h += '<div class="qtext">' + esc(f.q) + "</div>";
    $("txt").classList.toggle("tapmode", f.t === "tap");
    if (f.t === "yn") {
      h += '<div class="answers yn" id="answers"><button class="ans" data-v="1"><span class="ic">👍</span>Ja</button><button class="ans" data-v="0"><span class="ic">👎</span>Nein</button></div>';
    } else if (f.t === "mc") {
      var order = shuffle(f.o.map(function (_, i) { return i; }));
      h += '<div class="answers" id="answers">';
      order.forEach(function (oi, n) { h += '<button class="ans" data-v="' + oi + '"><span class="k">' + "ABCD"[n] + "</span><span>" + esc(f.o[oi]) + "</span></button>"; });
      h += "</div>";
    } else {
      h += '<div class="tapinfo"><span class="ic">👈</span><span>Tippe im Text links auf das richtige Wort.</span></div>';
    }
    h += '<div class="fb" id="fb"></div>';
    $("qcard").innerHTML = h;
    st.locked = false;
    var a = $("answers");
    if (a) a.addEventListener("click", function (e) {
      var b = e.target.closest(".ans"); if (!b || st.locked) return;
      var v = +b.dataset.v;
      answer(f.t === "yn" ? (v === 1) === f.a : v === f.a, b);
    });
  }

  $("txt").addEventListener("click", function (e) {
    var w = e.target.closest(".w");
    if (!w || !cur || !st || st.i < 0 || st.done || st.locked) return;
    var f = cur.fragen[st.i]; if (f.t !== "tap") return;
    answer(norm(w.textContent) === norm(f.a), w);
  });

  function answer(right, el) {
    var f = cur.fragen[st.i];
    if (right) {
      st.locked = true;
      var first = st.tries === 0;
      if (st.results[st.i] === undefined) st.results[st.i] = first ? 1 : 0;
      clearMarks();
      if (f.t === "tap") $("txt").classList.remove("tapmode"); else { el.classList.add("ok"); $("answers").classList.add("locked"); }
      mark(f.h, "found");
      if (f.t === "tap") el.classList.add("tapok");
      sfx.ok();
      var gain = st.repeat ? (first ? 1 : 0) : (first ? 3 : 1);
      if (gain) { st.earned += gain; setTimeout(function () { addCoins(gain, el); }, 150); }
      var last = st.i === cur.fragen.length - 1;
      $("fb").innerHTML = '<div class="msg ok"><span class="ic">✅</span><span>' + LOB[Math.floor(Math.random() * LOB.length)] + ' <span style="font-weight:700;opacity:.8">Grün markiert: Hier steht es im Text.</span></span></div>' +
        '<button class="btn wide" id="next">' + (last ? "Fertig – zum Ergebnis ⭐" : "Weiter →") + "</button>";
      var q = $("qcard").querySelector(".dots"); if (q) q.outerHTML = dots();
      $("next").onclick = function () { sfx.tap(); if (last) showResult(); else { st.i++; showQ(); } };
    } else {
      st.tries++;
      sfx.bad();
      if (f.t === "tap") { el.classList.add("tapbad"); setTimeout(function () { el.classList.remove("tapbad"); }, 700); }
      else el.classList.add("bad");
      clearHint(); mark(f.h, "hint");
      $("fb").innerHTML = '<div class="msg bad"><span class="ic">💡</span><span>Noch nicht ganz. Lies die <b>gelb markierte</b> Stelle im Text noch einmal genau – und versuch es dann nochmal.</span></div>';
    }
  }

  function showResult() {
    st.done = true; clearMarks(); $("txt").classList.remove("tapmode");
    var n = cur.fragen.length;
    var good = st.results.filter(function (r) { return r === 1; }).length;
    var stars = good === n ? 3 : good >= Math.ceil(n * 0.6) ? 2 : 1;
    var before = store.stars[cur.id] || 0;
    var lines = [["Richtige Antworten", st.earned]];
    var bonus = 0;
    if (stars > before) { var nb = (stars - before) * 5; lines.push(["Neue Sterne (" + (stars - before) + "×)", nb]); bonus += nb; store.stars[cur.id] = stars; }
    if (stars === 3) { var pb = store.perfect[cur.id] ? 5 : 20; lines.push([store.perfect[cur.id] ? "Wieder perfekt!" : "Perfekt-Bonus!", pb]); bonus += pb; store.perfect[cur.id] = true; }
    store.coins += bonus; save();
    var trophies = checkTrophies();
    var total = st.earned + bonus;

    var titles = { 3: "Fantastisch, " + esc(pname()) + "!", 2: "Gut gemacht!", 1: "Geschafft!" };
    var texts = { 3: "Du hast alles beim ersten Versuch richtig verstanden.", 2: "Du hast den Text gut verstanden. Mit noch einmal Lesen schaffst du 3 Sterne!", 1: "Lies den Text nochmal in Ruhe – beim nächsten Mal klappt es noch besser." };
    var list = TEXTE.filter(function (t) { return t.stufe === cur.stufe; });
    var next = list[list.indexOf(cur) + 1] || TEXTE.filter(function (t) { return t.stufe === cur.stufe + 1; })[0];
    var ln = lines.filter(function (l) { return l[1]; }).map(function (l) { return '<div class="ln"><span>' + l[0] + "</span><span>+" + l[1] + "</span></div>"; }).join("");
    $("qcard").innerHTML = dots() +
      '<div class="result"><div class="bigstars">' + starsHtml(stars) + "</div><h4>" + titles[stars] + "</h4>" +
      "<p><b>" + good + " von " + n + "</b> Fragen beim ersten Versuch richtig.</p><p>" + texts[stars] + "</p>" +
      '<div class="earn"><div class="tot">+<span id="earnNum">0</span> ' + COIN + "</div>" + ln + "</div>" +
      '<div class="col">' + (next ? '<button class="btn" id="nextText">Nächster Text →</button>' : "") +
      '<div class="row"><button class="btn light" id="again">↻ Nochmal</button><button class="btn light" id="toHero">🛍️ Mein Held</button></div></div></div>';
    countUp($("earnNum"), total);
    showCoins(true);
    $("again").onclick = function () { openText(cur.id); };
    $("toHero").onclick = function () { location.hash = "#/held"; };
    if (next) $("nextText").onclick = function () { if (next.stufe !== store.stufe) { store.stufe = next.stufe; save(); } history.replaceState(null, "", "#/t/" + next.id); openText(next.id); };
    if (stars === 3 || trophies.length) celebrate(stars === 3, total, trophies);
    else { sfx.coin(); confetti(30); }
  }
  function countUp(el, to) {
    var v = 0, step = Math.max(1, Math.round(to / 25));
    var t = setInterval(function () { v = Math.min(to, v + step); if (el) el.textContent = v; if (v >= to) clearInterval(t); }, 40);
  }

  // ── Feier ──
  var fwTimer = null;
  function celebrate(perfect, coins, trophies) {
    var p = $("party");
    var title = perfect ? "PERFEKT!" : "NEUER POKAL!";
    var tHtml = title.split("").map(function (ch, i) { return '<span style="animation-delay:' + (i * 0.08) + 's">' + (ch === " " ? "&nbsp;" : ch) + "</span>"; }).join("");
    var tro = trophies.map(function (t, i) { return '<div style="animation-delay:' + (0.6 + i * 0.25) + 's"><b>' + t.icon + "</b> " + esc(t.name) + " &nbsp;+" + t.bonus + " " + COIN + "</div>"; }).join("");
    $("pbox").innerHTML = '<div class="bigav">' + heroSvg(perfect ? { hand: "i_pokal" } : null, { cls: "dance" }) + "</div>" +
      '<div class="pinfo">' + (perfect ? "" : '<span class="trophyspin">🏆</span>') + '<div class="ptitle">' + tHtml + "</div>" +
      '<div class="psub">' + (perfect ? "Alle Fragen beim ersten Versuch richtig!" : "Du hast einen neuen Pokal verdient!") + "</div>" +
      '<div class="pcoins">+<span id="pNum">0</span> ' + COIN + "</div>" +
      (tro ? '<div class="ptro">' + tro + "</div>" : "") +
      '<button class="btn gold" id="pClose" style="margin-top:8px">Juhu! Weiter →</button></div>';
    var sum = coins + trophies.reduce(function (s, t) { return s + t.bonus; }, 0);
    p.classList.add("on");
    countUp($("pNum"), sum);
    sfx.fanfare();
    setTimeout(function () { for (var i = 0; i < 6; i++) setTimeout(sfx.coin, i * 110); }, 900);
    fireworks(); coinRain(22); confetti(60);
    $("pClose").onclick = function () { p.classList.remove("on"); stopFireworks(); showCoins(true); };
  }
  function confetti(n) {
    var cols = ["#F2B705", "#2E9A57", "#2F7FC1", "#8A55C2", "#D2493F", "#157A7A", "#EC5FA8"];
    for (var i = 0; i < n; i++) {
      var c = document.createElement("div"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw"; c.style.background = cols[i % cols.length];
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; c.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(c); setTimeout(function (el) { el.remove(); }, 4500, c);
    }
  }
  function coinRain(n) {
    for (var i = 0; i < n; i++) {
      var c = document.createElement("div"); c.className = "coinrain"; c.innerHTML = COIN;
      c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = 1.6 + Math.random() * 1.6 + "s"; c.style.animationDelay = 0.3 + Math.random() * 1.2 + "s";
      document.body.appendChild(c); setTimeout(function (el) { el.remove(); }, 4500, c);
    }
  }
  var parts = [], raf = null;
  function fireworks() {
    var cv = $("fw"), ctx = cv.getContext("2d");
    cv.width = innerWidth; cv.height = innerHeight; parts = [];
    var cols = ["#FFD23F", "#FF6B6B", "#6BCBFF", "#B388FF", "#7CF29C", "#FF9F1C", "#FFFFFF"];
    function burst() {
      var x = cv.width * (0.1 + Math.random() * 0.8), y = cv.height * (0.12 + Math.random() * 0.4), col = cols[Math.floor(Math.random() * cols.length)];
      for (var i = 0; i < 46; i++) { var a = Math.PI * 2 * i / 46, sp = 2 + Math.random() * 3.5; parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 60 + Math.random() * 30, col: col }); }
    }
    burst(); burst();
    fwTimer = setInterval(burst, 650);
    function step() {
      ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.globalCompositeOperation = "lighter";
      parts = parts.filter(function (p) { return p.life > 0; });
      parts.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.life--; ctx.globalAlpha = Math.min(1, p.life / 40); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(step);
    }
    cancelAnimationFrame(raf); step();
    setTimeout(function () { clearInterval(fwTimer); }, 6000);
  }
  function stopFireworks() { clearInterval(fwTimer); cancelAnimationFrame(raf); var cv = $("fw"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); }

  // ── Held & Shop ──
  var heroSlot = "outfit", sel = null;
  function slotDef(id) { return A.SLOTS.filter(function (s) { return s.id === id; })[0]; }
  function currentOf(slot) { return store.equip[slot] !== undefined ? store.equip[slot] : (A.DEFAULT[slot] || null); }
  function renderHero(hop) {
    showCoins();
    var tryIt = sel !== null && sel !== "__none" ? !owns(sel) : false;
    var pe = null;
    if (sel !== null) { pe = {}; pe[heroSlot] = sel === "__none" ? null : sel; }
    $("heroAv").innerHTML = heroSvg(pe, { cls: hop ? "hop" : "" });
    $("tryTag").classList.toggle("on", tryIt);
    $("slots").innerHTML = A.SLOTS.map(function (s) { return '<button class="slotchip' + (s.id === heroSlot ? " on" : "") + '" data-s="' + s.id + '">' + s.icon + " " + s.name + "</button>"; }).join("");
    var sd = slotDef(heroSlot), cu = currentOf(heroSlot);
    var items = A.ITEMS.filter(function (it) { return it.slot === heroSlot; }).sort(function (a, b) { return a.price - b.price; });
    var html = "";
    if (sd.optional) html += '<button class="tile' + (cu === null ? " eq" : "") + (sel === "__none" ? " sel" : "") + '" data-id="__none"><div class="th"><span class="none">🚫</span></div><div class="nm">Nichts</div><div class="pr owned">gratis</div></button>';
    items.forEach(function (it) {
      var ow = owns(it.id), eq = cu === it.id;
      var e = {}; e[heroSlot] = it.id;
      var noBg = heroSlot !== "hintergrund" && heroSlot !== "effekt";
      var pr = ow ? '<div class="pr owned">' + (eq ? "an" : "gekauft") + "</div>" : '<div class="pr' + (store.coins < it.price ? " poor" : "") + '">' + COIN + it.price + "</div>";
      html += '<button class="tile' + (eq ? " eq" : "") + (sel === it.id ? " sel" : "") + (ow ? "" : " locked") + '" data-id="' + it.id + '"><div class="th">' + heroSvg(e, { viewBox: sd.view, noBg: noBg }) + '</div><div class="nm">' + esc(it.name) + "</div>" + pr + "</button>";
    });
    $("items").innerHTML = html;
    renderAct();
    var tro = TROPHIES.map(function (t) { var has = store.trophies.indexOf(t.id) >= 0; return '<span class="' + (has ? "" : "no") + '" title="' + esc(t.name) + '">' + t.icon + "</span>"; }).join("");
    $("trophies").innerHTML = tro;
  }
  function renderAct() {
    var bar = $("actbar");
    if (sel === null) { bar.innerHTML = '<div class="what">Tippe auf ein Teil, um es anzuprobieren.<small>Münzen bekommst du für richtige Antworten.</small></div>'; return; }
    var cu = currentOf(heroSlot);
    if (sel === "__none") {
      bar.innerHTML = '<div class="what">Nichts tragen</div>' + (cu === null ? '<button class="btn light" disabled>Ist schon so</button>' : '<button class="btn" id="actEq">Ablegen</button>');
    } else {
      var it = A.BY[sel], ow = owns(sel);
      if (ow) {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>" + (cu === sel ? "Trägst du gerade." : "Gehört dir schon.") + "</small></div>" +
          (cu === sel ? (slotDef(heroSlot).optional ? '<button class="btn light" id="actOff">Ablegen</button>' : '<button class="btn light" disabled>Trägst du</button>') : '<button class="btn" id="actEq">Anziehen</button>');
      } else if (store.coins >= it.price) {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>Gefällt es dir? Dann kauf es!</small></div>" + '<button class="btn gold" id="actBuy">Kaufen für ' + it.price + " " + COIN + "</button>";
      } else {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>Dir fehlen noch " + (it.price - store.coins) + " Münzen. Lies weiter, dann klappt es!</small></div>" + '<button class="btn gold" disabled>' + it.price + " " + COIN + "</button>";
      }
    }
    var b;
    if ((b = $("actEq"))) b.onclick = function () { store.equip[heroSlot] = sel === "__none" ? null : sel; save(); sfx.ok(); sel = null; renderHero(true); };
    if ((b = $("actOff"))) b.onclick = function () { store.equip[heroSlot] = null; save(); sfx.tap(); sel = null; renderHero(true); };
    if ((b = $("actBuy"))) b.onclick = function () {
      var it = A.BY[sel]; if (store.coins < it.price) return;
      store.coins -= it.price; store.owned.push(it.id); store.equip[heroSlot] = it.id; save();
      sfx.buy(); confetti(40); sel = null; renderHero(true); showCoins(true);
    };
  }
  $("slots").addEventListener("click", function (e) { var b = e.target.closest(".slotchip"); if (!b) return; sfx.tap(); heroSlot = b.dataset.s; sel = null; renderHero(); $("items").scrollTop = 0; });
  $("items").addEventListener("click", function (e) {
    var b = e.target.closest(".tile"); if (!b) return;
    sfx.tap();
    var id = b.dataset.id;
    sel = sel === id ? null : id;
    var keep = $("items").scrollTop; renderHero(sel !== null); $("items").scrollTop = keep;
  });
  $("heroBack").onclick = function () { goHome(); };

  // Schriftgröße
  function setSize(d) { store.size = Math.max(21, Math.min(37, store.size + d)); save(); document.documentElement.style.setProperty("--textsize", store.size + "px"); }
  $("smaller").onclick = function () { setSize(-2); };
  $("bigger").onclick = function () { setSize(2); };

  function goHome() { location.replace("#/"); }
  $("backBtn").onclick = goHome;

  // ── Router ──
  function route() {
    var m = /^#\/t\/(\d+)/.exec(location.hash), hero = location.hash === "#/held";
    $("party").classList.remove("on"); stopFireworks();
    var cf = document.querySelectorAll(".confetti,.coinrain,.floatcoin"); for (var ci = 0; ci < cf.length; ci++) cf[ci].remove();
    $("home").classList.toggle("on", !m && !hero);
    $("read").classList.toggle("on", !!m);
    $("hero").classList.toggle("on", hero);
    if (m) { var id = +m[1]; if (!cur || cur.id !== id || st.done) openText(id); }
    else if (hero) { cur = null; sel = null; renderHero(); }
    else { cur = null; renderHome(); }
  }
  window.addEventListener("hashchange", route);
  route();
  if (!store.profile) openProfile(false);
})();
</script>
</body>
</html>
