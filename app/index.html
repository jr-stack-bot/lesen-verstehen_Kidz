<!doctype html>
<!-- Lesen & Verstehen – Lese-App für Kinder · @ Joschy -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lesen & Verstehen</title>
<style>
@font-face { font-family: "Andika"; src: url(fonts/andika-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Andika"; src: url(fonts/andika-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Nunito"; src: url(fonts/nunito-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Nunito"; src: url(fonts/nunito-latin-900-normal.woff2) format("woff2"); font-weight: 900; }

:root {
  --bg: #F4EEE3; --paper: #FFFDF8; --ink: #26252E; --ink-soft: #5E5B66; --line: #E4DCCD;
  --teal: #157A7A; --teal-soft: #DDF0EE; --mark: #FFE27A;
  --ok: #2E9A57; --ok-soft: #DDF3E4; --bad: #D2493F; --bad-soft: #FBE3E0;
  --s1: #3E9B5F; --s1-soft: #E2F2E6; --s2: #2F7FC1; --s2-soft: #E1EDF8; --s3: #8A55C2; --s3-soft: #EEE5F8;
  --star: #F2B705; --coin: #E9A800; --radius: 1.375rem; --textsize: 1.6875rem;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--z, 1)); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font-family: "Nunito", system-ui, sans-serif; font-weight: 700; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }
.pill { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--paper); border: 0.125rem solid var(--line); border-radius: 62.4375rem; padding: 0.5rem 1.125rem; font-size: 1.375rem; font-weight: 900; white-space: nowrap; }
.pill .st { color: var(--star); font-size: 1.625rem; }
.pill.coins { color: #8A5F00; }
.coin { display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF2A8 0 18%, #FFD23F 19% 55%, #E9A800 56%); box-shadow: inset 0 0 0 0.125rem #C98F00; vertical-align: -0.15em; position: relative; }
.coin::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; border: 0.125rem solid rgba(201,143,0,.55); }
.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* ── Übersicht ── */
.home-head { display: flex; align-items: center; gap: 1.125rem; padding: 1.25rem 2.25rem 0.375rem; }
.me { width: 5.75rem; height: 5.75rem; border-radius: 50%; overflow: hidden; background: var(--teal-soft); border: 0.25rem solid var(--paper); box-shadow: 0 0 0 0.1875rem var(--teal); flex: none; position: relative; }
.me svg { width: 100%; height: 100%; display: block; }
.home-head h1 { margin: 0; font-size: 2.25rem; font-weight: 900; letter-spacing: -0.0312rem; }
.home-head .sub { color: var(--ink-soft); font-size: 1.1875rem; margin-top: 0.125rem; }
.head-right { margin-left: auto; display: flex; align-items: center; gap: 0.625rem; }
.iconbtn { width: 3.25rem; height: 3.25rem; border-radius: 50%; background: var(--paper); border: 0.125rem solid var(--line); font-size: 1.5rem; }
.shopbtn { white-space: nowrap; display: flex; align-items: center; gap: 0.625rem; background: linear-gradient(135deg, #8A55C2, #5B3FB5); color: #fff; border-radius: 1.125rem; padding: 0.75rem 1.25rem; font-size: 1.3125rem; font-weight: 900; box-shadow: 0 0.25rem 0 #3E2A85; }
.shopbtn .ic { font-size: 1.625rem; }
.tabs { display: flex; gap: 0.875rem; padding: 0.75rem 2.25rem 0.875rem; }
.tab { flex: 1; border-radius: 1.125rem; padding: 0.75rem 1.125rem; background: var(--paper); border: 0.1875rem solid var(--line); display: flex; align-items: center; gap: 0.875rem; font-size: 1.375rem; font-weight: 900; transition: transform .1s; }
.tab small { display: block; font-size: 1rem; font-weight: 700; color: var(--ink-soft); }
.tab .dot { width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 1.375rem; flex: none; }
.tab[data-s="1"] .dot { background: var(--s1); } .tab[data-s="2"] .dot { background: var(--s2); } .tab[data-s="3"] .dot { background: var(--s3); }
.tab.on[data-s="1"] { border-color: var(--s1); background: var(--s1-soft); }
.tab.on[data-s="2"] { border-color: var(--s2); background: var(--s2-soft); }
.tab.on[data-s="3"] { border-color: var(--s3); background: var(--s3-soft); }
.tab .prog { margin-left: auto; font-size: 1.125rem; color: var(--ink-soft); }
.grid { flex: 1; overflow-y: auto; padding: 0.25rem 2.25rem 1.5rem; display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 0.875rem; align-content: start; }
.card { background: var(--paper); border: 0.125rem solid var(--line); border-radius: 1.25rem; padding: 0.875rem 0.625rem 0.625rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.375rem; min-height: 10.625rem; box-shadow: 0 0.1875rem 0 var(--line); transition: transform .1s; position: relative; }
.card:active, .tab:active, .btn:active, .ans:active, .tile:active, .shopbtn:active, .me:active { transform: scale(.97); }
.card .em { font-size: 2.875rem; line-height: 1.1; font-family: "Nunito", sans-serif; }
.card .t { font-size: 1.0625rem; line-height: 1.2; font-weight: 900; flex: 1; display: flex; align-items: center; }
.card .stars { font-size: 1.375rem; letter-spacing: 0.125rem; color: #D9D2C4; }
.card .stars .y { color: var(--star); }
.card.done { border-color: #E9D78F; background: #FFFBEA; }
.card.perfect::after { content: "👑"; position: absolute; top: -0.625rem; right: -0.375rem; font-size: 1.625rem; transform: rotate(14deg); }
.card .nr { position: absolute; top: 0.5rem; left: 0.625rem; font-size: 0.8125rem; color: #B5AC9C; }
.foot { text-align: center; padding: 0 0 0.625rem; }
.foot button { color: var(--ink-soft); font-size: 0.875rem; text-decoration: underline; opacity: .6; }
.foot .by { color: var(--ink-soft); font-size: 0.8125rem; opacity: .45; margin-left: 0.875rem; }
.home-head h1 { cursor: pointer; }

/* ── Profil ── */
#profil { position: fixed; inset: 0; z-index: 35; display: none; overflow-y: auto; background: var(--bg); }
#profil.on { display: block; }
.pf { max-width: 61.25rem; margin: 0 auto; padding: 1rem 2.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
.pf-head { display: flex; align-items: center; gap: 1rem; }
.pf-head .big { font-size: 3.625rem; line-height: 1; }
.pf-head h1 { margin: 0; font-size: 2.625rem; font-weight: 900; letter-spacing: -0.0312rem; }
.pf-head .sub { color: var(--ink-soft); font-size: 1.1875rem; margin-top: 0.125rem; }
.pf-card { background: var(--paper); border: 0.125rem solid var(--line); border-radius: var(--radius); padding: 0.875rem 1.625rem 1rem; box-shadow: 0 0.1875rem 0 var(--line); }
.pf-card label { display: block; font-size: 1.5625rem; font-weight: 900; margin-bottom: 0.625rem; }
.pf-card label .n { display: inline-grid; place-items: center; width: 2.375rem; height: 2.375rem; border-radius: 50%; background: var(--teal); color: #fff; font-size: 1.25rem; margin-right: 0.625rem; vertical-align: 0.125rem; }
#pfName { width: 100%; font-family: "Andika", sans-serif; font-weight: 700; font-size: 2rem; color: var(--ink); background: #fff; border: 0.1875rem solid var(--line); border-radius: 1.125rem; padding: 0.875rem 1.25rem; outline: none; user-select: text; -webkit-user-select: text; }
#pfName:focus { border-color: var(--teal); box-shadow: 0 0 0 0.25rem var(--teal-soft); }
#pfName::placeholder { color: #C2B9A8; }
.ages { display: flex; gap: 0.75rem; }
.age { flex: 1; height: 4.5rem; border-radius: 1.25rem; background: #fff; border: 0.1875rem solid var(--line); box-shadow: 0 0.1875rem 0 var(--line); font-size: 2.25rem; font-weight: 900; transition: transform .1s, background .2s, border-color .2s; }
.age:active { transform: scale(.95); }
.age.on { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 0.25rem 0 #0E5656; }
.pf-hint { color: var(--ink-soft); font-size: 1.0625rem; margin-top: 0.5rem; }
.genders { display: flex; gap: 1rem; }
.gender { flex: 1; display: flex; align-items: center; gap: 1.125rem; padding: 0.5rem 1.25rem 0.5rem 0.625rem; border-radius: 1.25rem; background: #fff; border: 0.1875rem solid var(--line); box-shadow: 0 0.1875rem 0 var(--line); font-size: 2rem; font-weight: 900; color: var(--ink); text-align: left; transition: transform .1s, background .2s, border-color .2s; }
.gender:active { transform: scale(.97); }
.gender .gv { width: 5rem; height: 6rem; flex: none; border-radius: 0.875rem; background: var(--teal-soft); overflow: hidden; }
.gender .gv svg { width: 100%; height: 100%; display: block; }
.gender .ck { margin-left: auto; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0.1875rem solid var(--line); display: grid; place-items: center; font-size: 1.375rem; color: transparent; }
.gender.on { background: var(--teal-soft); border-color: var(--teal); box-shadow: 0 0.25rem 0 #0E5656; }
.gender.on .gv { background: #fff; }
.gender.on .ck { background: var(--teal); border-color: var(--teal); color: #fff; }
.pf-btns { display: flex; gap: 0.875rem; justify-content: flex-end; align-items: center; }
.pf-btns .btn { font-size: 1.625rem; padding: 1.125rem 2.5rem; }

/* ── Lesen ── */
.bar { display: flex; align-items: center; gap: 0.875rem; padding: 0.75rem 1.5rem; }
.back { background: var(--paper); border: 0.125rem solid var(--line); border-radius: 1rem; padding: 0.625rem 1.25rem; font-size: 1.25rem; font-weight: 900; }
.bar h2 { margin: 0; font-size: 1.6875rem; font-weight: 900; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { border-radius: 62.4375rem; padding: 0.375rem 1rem; font-size: 1.0625rem; font-weight: 900; color: #fff; }
.size { display: flex; gap: 0.5rem; }
.size button { width: 3.375rem; height: 3.125rem; border-radius: 0.875rem; background: var(--paper); border: 0.125rem solid var(--line); font-family: "Andika", sans-serif; font-weight: 700; }
.size button:first-child { font-size: 1.125rem; } .size button:last-child { font-size: 1.75rem; }
.split { flex: 1; display: flex; gap: 1.25rem; padding: 0 1.5rem 1.375rem; min-height: 0; }
.textpane { flex: 1.3; background: var(--paper); border-radius: var(--radius); border: 0.125rem solid var(--line); overflow-y: auto; padding: 2rem 2.75rem 3.75rem; position: relative; scroll-behavior: smooth; }
.textpane .head { display: flex; align-items: center; gap: 0.875rem; margin-bottom: 1rem; }
.textpane .head .em { font-size: 2.75rem; }
.textpane .head h3 { margin: 0; font-family: "Andika", sans-serif; font-size: calc(var(--textsize) * 1.2); font-weight: 700; }
.txt p { font-family: "Andika", sans-serif; font-weight: 400; font-size: var(--textsize); line-height: 1.75; margin: 0 0 .85em; word-spacing: .06em; letter-spacing: .01em; }
.w { border-radius: 0.375rem; padding: 0.0625rem 0; transition: background .25s, box-shadow .25s; }
.w.hint { background: var(--mark); box-shadow: 0 0 0 0.1875rem var(--mark); }
.w.found { background: var(--ok-soft); box-shadow: 0 0 0 0.1875rem var(--ok-soft); }
.tapmode .w { cursor: pointer; border-bottom: 0.125rem dotted #B9B0A0; }
.w.tapbad { background: var(--bad-soft); box-shadow: 0 0 0 0.1875rem var(--bad-soft); animation: shake .35s; }
.w.tapok { background: var(--ok); color: #fff; box-shadow: 0 0 0 0.25rem var(--ok); transition: none; }

.qpane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.qcard { flex: 1; background: var(--paper); border-radius: var(--radius); border: 0.125rem solid var(--line); padding: 1.625rem 1.875rem; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
.dots { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.dots i { flex: 1; height: 0.625rem; border-radius: 0.3125rem; background: var(--line); }
.dots i.ok { background: var(--ok); } .dots i.retry { background: var(--star); } .dots i.cur { background: var(--teal); }
.qnum { color: var(--ink-soft); font-size: 1.125rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
.qtext { font-family: "Andika", sans-serif; font-size: 1.8125rem; line-height: 1.4; font-weight: 700; margin-bottom: 1.375rem; }
.answers { display: flex; flex-direction: column; gap: 0.875rem; }
.answers.yn { flex-direction: row; }
.ans { display: flex; align-items: center; gap: 1rem; text-align: left; background: #fff; border: 0.1875rem solid var(--line); border-radius: 1.125rem; padding: 0.875rem 1.25rem; font-family: "Andika", sans-serif; font-size: 1.5rem; line-height: 1.3; min-height: 4.625rem; box-shadow: 0 0.1875rem 0 var(--line); transition: transform .1s, background .2s, border-color .2s; }
.ans .k { flex: none; width: 2.625rem; height: 2.625rem; border-radius: 0.75rem; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 1.375rem; }
.answers.yn .ans { flex: 1; justify-content: center; font-family: "Nunito", sans-serif; font-weight: 900; font-size: 1.875rem; min-height: 7.5rem; flex-direction: column; gap: 0.25rem; }
.answers.yn .ans .ic { font-size: 2.5rem; }
.ans.ok { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 0.1875rem 0 var(--ok); }
.ans.ok .k { background: var(--ok); color: #fff; }
.ans.bad { background: var(--bad-soft); border-color: var(--bad); box-shadow: none; opacity: .75; animation: shake .35s; pointer-events: none; }
.ans.bad .k { background: var(--bad); color: #fff; }
.locked .ans { pointer-events: none; }
.tapinfo { display: flex; align-items: center; gap: 1rem; background: var(--teal-soft); border-radius: 1.125rem; padding: 1.25rem 1.375rem; font-size: 1.375rem; color: var(--teal); }
.tapinfo .ic { font-size: 2.75rem; animation: nudge 1.2s infinite; }
.fb { margin-top: auto; padding-top: 1rem; }
.msg { border-radius: 1.125rem; padding: 0.875rem 1.25rem; font-size: 1.3125rem; display: flex; align-items: center; gap: 0.875rem; }
.msg.ok { background: var(--ok-soft); color: #1E6E3D; }
.msg.bad { background: #FFF4CC; color: #7A5A00; }
.msg .ic { font-size: 2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.625rem; background: var(--teal); color: #fff; border-radius: 1.125rem; padding: 1.125rem 1.75rem; font-size: 1.5rem; font-weight: 900; box-shadow: 0 0.25rem 0 #0E5656; transition: transform .1s; }
.btn.wide { width: 100%; margin-top: 0.75rem; }
.btn.light { background: var(--paper); color: var(--ink); border: 0.125rem solid var(--line); box-shadow: 0 0.1875rem 0 var(--line); }
.btn.gold { background: linear-gradient(180deg, #FFD23F, #E9A800); color: #5A3E00; box-shadow: 0 0.25rem 0 #B07D00; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.start { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1rem; padding: 0.625rem; }
.start .big { font-size: 4.75rem; }
.start h4 { margin: 0; font-size: 1.875rem; font-weight: 900; }
.start p { margin: 0; font-size: 1.3125rem; color: var(--ink-soft); line-height: 1.45; max-width: 26.25rem; }
.start .reward { font-size: 1.125rem; color: #8A5F00; background: #FFF4CC; border-radius: 0.875rem; padding: 0.625rem 1rem; }
.floatcoin { position: fixed; z-index: 30; pointer-events: none; font-size: 1.875rem; font-weight: 900; color: #B07D00; text-shadow: 0 0.125rem 0 #fff; animation: floatup 1.1s ease-out forwards; }
@keyframes floatup { from { transform: translateY(0) scale(.8); opacity: 0; } 20% { opacity: 1; transform: translateY(-0.625rem) scale(1.15); } to { transform: translateY(-4.375rem) scale(1); opacity: 0; } }

.result { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0.75rem; }
.result .bigstars { font-size: 4.125rem; letter-spacing: 0.375rem; color: #DDD5C6; }
.result .bigstars .y { color: var(--star); display: inline-block; animation: pop .5s backwards; }
.result .bigstars .y:nth-child(2) { animation-delay: .2s; } .result .bigstars .y:nth-child(3) { animation-delay: .4s; }
.result h4 { margin: 0; font-size: 2rem; font-weight: 900; }
.result p { margin: 0; font-size: 1.25rem; color: var(--ink-soft); }
.earn { background: #FFF7D6; border: 0.125rem solid #F3DE8A; border-radius: 1.125rem; padding: 0.625rem 1.125rem; width: 100%; max-width: 23.75rem; }
.earn .tot { font-size: 1.875rem; font-weight: 900; color: #8A5F00; }
.earn .ln { font-size: 1rem; color: #8A6A1F; display: flex; justify-content: space-between; }
.result .col { display: flex; flex-direction: column; gap: 0.625rem; margin-top: 0.5rem; width: 100%; max-width: 23.75rem; }
.result .row { display: flex; gap: 0.625rem; } .result .row .btn { flex: 1; padding: 0.875rem 0.625rem; font-size: 1.25rem; }

/* ── Held & Shop ── */
.herowrap { flex: 1; display: flex; gap: 1.25rem; padding: 0 1.5rem 1.375rem; min-height: 0; }
.stage { width: 26.25rem; flex: none; background: var(--paper); border: 0.125rem solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; padding: 1rem; position: relative; overflow: hidden; }
.stage .av { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage .av svg { height: 100%; max-width: 100%; border-radius: 1.125rem; }
.stage .tag { position: absolute; top: 1.75rem; left: 1.75rem; background: #8A55C2; color: #fff; border-radius: 62.4375rem; padding: 0.375rem 0.875rem; font-size: 1rem; font-weight: 900; display: none; }
.stage .tag.on { display: block; }
.trophies { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: center; margin-top: 0.625rem; min-height: 2.125rem; }
.trophies span { font-size: 1.25rem; width: 2rem; height: 2rem; display: grid; place-items: center; background: #FFF7D6; border-radius: 0.75rem; }
.trophies span.no { filter: grayscale(1); opacity: .25; background: #EEE7DA; }
.shop { flex: 1; display: flex; flex-direction: column; background: var(--paper); border: 0.125rem solid var(--line); border-radius: var(--radius); min-width: 0; overflow: hidden; }
.slots { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem 1rem 0.625rem; border-bottom: 0.125rem solid var(--line); }
.slotchip { display: flex; align-items: center; gap: 0.375rem; padding: 0.5rem 0.875rem; border-radius: 62.4375rem; background: #F4EEE3; font-size: 1.0625rem; font-weight: 900; border: 0.125rem solid transparent; }
.slotchip.on { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
.items { flex: 1; overflow-y: auto; padding: 0.875rem 1rem; display: grid; grid-template-columns: repeat(var(--icols, 4), 1fr); gap: 0.75rem; align-content: start; }
.tile { background: #fff; border: 0.1875rem solid var(--line); border-radius: 1.125rem; padding: 0.375rem 0.375rem 0.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; position: relative; transition: transform .1s; }
.tile .th { width: 100%; aspect-ratio: 1 / 1; border-radius: 0.75rem; overflow: hidden; background: #F1EBDF; display: grid; place-items: center; }
.tile .th svg { width: 100%; height: 100%; }
.tile .th .none { font-size: 2.5rem; opacity: .5; }
.tile .nm { font-size: 0.9375rem; font-weight: 900; text-align: center; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
.tile .pr { font-size: 1rem; font-weight: 900; color: #8A5F00; display: flex; align-items: center; gap: 0.3125rem; }
.tile .pr.owned { color: var(--ok); }
.tile .pr.poor { color: #B9A88A; }
.tile.sel { border-color: #8A55C2; box-shadow: 0 0 0 0.1875rem #E6DAF5; }
.tile.eq { border-color: var(--ok); }
.tile.eq::after { content: "✓"; position: absolute; top: -0.5rem; right: -0.5rem; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 1.0625rem; }
.tile.locked .th { filter: saturate(.75); }
.actbar { border-top: 0.125rem solid var(--line); padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.875rem; min-height: 5.25rem; }
.actbar .what { flex: 1; font-size: 1.25rem; font-weight: 900; }
.actbar .what small { display: block; font-size: 0.9375rem; color: var(--ink-soft); font-weight: 700; }
.actbar .btn { padding: 0.875rem 1.375rem; font-size: 1.3125rem; }

/* ── Feier-Overlay ── */
#party { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(43,31,94,.82), rgba(12,10,30,.94)); }
#party.on { display: flex; }
#party canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pbox { position: relative; display: flex; align-items: center; gap: 1.875rem; color: #fff; }
.pbox .bigav { width: 18.75rem; height: 24.375rem; }

      html += '<button class="tile' + (eq ? " eq" : "") + (sel === it.id ? " sel" : "") + (ow ? "" : " locked") + '" data-id="' + it.id + '"><div class="th">' + heroSvg(e, { viewBox: sd.view, noBg: noBg }) + '</div><div class="nm">' + esc(it.name) + "</div>" + pr + "</button>";
    });
    $("items").innerHTML = html;
    renderAct();
    var tro = TROPHIES.map(function (t) { var has = store.trophies.indexOf(t.id) >= 0; return '<span class="' + (has ? "" : "no") + '" title="' + esc(t.name) + '">' + t.icon + "</span>"; }).join("");
    $("trophies").innerHTML = tro;
  }
  function renderAct() {
    var bar = $("actbar");
    if (sel === null) { bar.innerHTML = '<div class="what">Tippe auf ein Teil, um es anzuprobieren.<small>Münzen bekommst du für richtige Antworten.</small></div>'; return; }
    var cu = currentOf(heroSlot);
    if (sel === "__none") {
      bar.innerHTML = '<div class="what">Nichts tragen</div>' + (cu === null ? '<button class="btn light" disabled>Ist schon so</button>' : '<button class="btn" id="actEq">Ablegen</button>');
    } else {
      var it = A.BY[sel], ow = owns(sel);
      if (ow) {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>" + (cu === sel ? "Trägst du gerade." : (isFree(sel) ? "Kostenlos – einfach anziehen." : "Gehört dir schon.")) + "</small></div>" +
          (cu === sel ? (slotDef(heroSlot).optional ? '<button class="btn light" id="actOff">Ablegen</button>' : '<button class="btn light" disabled>Trägst du</button>') : '<button class="btn" id="actEq">Anziehen</button>');
      } else if (store.coins >= it.price) {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>Gefällt es dir? Dann kauf es!</small></div>" + '<button class="btn gold" id="actBuy">Kaufen für ' + it.price + " " + COIN + "</button>";
      } else {
        bar.innerHTML = '<div class="what">' + esc(it.name) + "<small>Dir fehlen noch " + (it.price - store.coins) + " Münzen. Lies weiter, dann klappt es!</small></div>" + '<button class="btn gold" disabled>' + it.price + " " + COIN + "</button>";
      }
    }
    var b;
    if ((b = $("actEq"))) b.onclick = function () { store.equip[heroSlot] = sel === "__none" ? null : sel; save(); sfx.ok(); sel = null; renderHero(true); };
    if ((b = $("actOff"))) b.onclick = function () { store.equip[heroSlot] = null; save(); sfx.tap(); sel = null; renderHero(true); };
    if ((b = $("actBuy"))) b.onclick = function () {
      var it = A.BY[sel]; if (store.coins < it.price) return;
      store.coins -= it.price; store.owned.push(it.id); store.equip[heroSlot] = it.id; save();
      sfx.buy(); confetti(40); sel = null; renderHero(true); showCoins(true);
    };
  }
  $("slots").addEventListener("click", function (e) { var b = e.target.closest(".slotchip"); if (!b) return; sfx.tap(); heroSlot = b.dataset.s; sel = null; renderHero(); $("items").scrollTop = 0; });
  $("items").addEventListener("click", function (e) {
    var b = e.target.closest(".tile"); if (!b) return;
    sfx.tap();
    var id = b.dataset.id;
    sel = sel === id ? null : id;
    var keep = $("items").scrollTop; renderHero(sel !== null); $("items").scrollTop = keep;
  });
  $("heroBack").onclick = function () { goHome(); };

  // Schriftgröße
  function setSize(d) { store.size = Math.max(21, Math.min(37, store.size + d)); save(); document.documentElement.style.setProperty("--textsize", (store.size / 16) + "rem"); }
  $("smaller").onclick = function () { setSize(-2); };
  $("bigger").onclick = function () { setSize(2); };

  // ── Anzeige (Größe & Aufteilung) – für andere Tablets und beide Ausrichtungen ──
  var SCALES = [70, 85, 100, 115, 130, 150];
  var LAYOUTS = { auto: "Automatisch", side: "Nebeneinander", stack: "Untereinander" };
  var disp = { z: 1, auto: 1, stack: false };
  function autoScale(w, h) {
    // Grundmaß: 1280×800 (Galaxy Tab S5e quer) bzw. 800×1280 hochkant
    var f = w >= h ? Math.min(w / 1280, h / 800) : Math.min(w / 800, h / 1280);
    f = Math.round(f * 20) / 20;
    return Math.max(0.7, Math.min(1.5, f));
  }
  function autoStack(w, h) { return w < h; }
  function applyDisplay() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    var d = store.display;
    disp.auto = autoScale(w, h);
    disp.want = d.scale === "auto" ? disp.auto : d.scale / 100;
    disp.stack = d.layout === "stack" || (d.layout === "auto" && autoStack(w, h));
    // Obergrenze, damit nichts abgeschnitten wird: Mindestfläche 620×700 (untereinander) bzw. 900×560 (nebeneinander)
    var zMax = disp.stack ? Math.min(w / 620, h / 700) : Math.min(w / 900, h / 560);
    disp.z = Math.min(disp.want, Math.floor(zMax * 100) / 100);
    disp.capped = disp.z < disp.want - 0.001;
    var ew = w / disp.z, eh = h / disp.z, root = document.documentElement;
    root.style.setProperty("--z", disp.z);
    root.classList.toggle("stack", disp.stack);
    root.classList.toggle("compact", ew < 1000);
    root.classList.toggle("narrow", ew < 1150 && !disp.stack);
    root.classList.toggle("low", eh < 720);
    root.classList.toggle("tiny", ew < 700);
    root.classList.toggle("tall", eh > ew);
    var gw = ew - (ew < 1000 ? 40 : 72);
    root.style.setProperty("--cols", Math.max(2, Math.min(6, Math.floor(gw / 190))));
    var sw = disp.stack ? ew - 32 : ew - 68 - (ew < 1150 ? 360 : 420);
    root.style.setProperty("--icols", Math.max(2, Math.min(6, Math.floor(sw / 180))));
    if ($("anzeige").classList.contains("on")) renderDisp();
  }
  function renderDisp() {
    var d = store.display, w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
    var sh = '<button class="opt' + (d.scale === "auto" ? " on" : "") + '" data-v="auto">Auto<small>jetzt ' + Math.round(disp.auto * 100) + " %</small></button>";
    SCALES.forEach(function (v) { sh += '<button class="opt' + (d.scale === v ? " on" : "") + '" data-v="' + v + '">' + v + " %</button>"; });
    $("azScale").innerHTML = sh;
    var lh = "";
    for (var k in LAYOUTS) {
      var sub = k === "auto" ? "jetzt " + (autoStack(w, h) ? "untereinander" : "nebeneinander") : k === "side" ? "Text links, Fragen rechts" : "Text oben, Fragen unten";
      lh += '<button class="opt' + (d.layout === k ? " on" : "") + '" data-v="' + k + '">' + LAYOUTS[k] + "<small>" + sub + "</small></button>";
    }
    $("azLayout").innerHTML = lh;
    $("azInfo").innerHTML = "📐 Aktuelle Auflösung: <b>" + w + " × " + h + "</b> CSS-Pixel (" + Math.round(w * dpr) + " × " + Math.round(h * dpr) + " Bildschirmpunkte) · " +
      (w >= h ? "Querformat" : "Hochformat") + " · Größe gerade <b>" + Math.round(disp.z * 100) + " %</b>" + (disp.capped ? " (auf diesem Bildschirm begrenzt, damit alles passt)" : "") + ", Aufteilung <b>" + (disp.stack ? "untereinander" : "nebeneinander") + "</b>.<br>Tipp: „Auto“ passt die Größe an das Tablet an. Wenn etwas zu groß oder zu klein ist, hier eine feste Größe wählen.";
  }
  function openDisp() { renderDisp(); $("anzeige").classList.add("on"); }
  $("dispBtn").onclick = $("pfDisp").onclick = function () { sfx.tap(); openDisp(); };
  $("azScale").addEventListener("click", function (e) { var b = e.target.closest(".opt"); if (!b) return; sfx.tap(); store.display.scale = b.dataset.v === "auto" ? "auto" : +b.dataset.v; save(); applyDisplay(); renderDisp(); });
  $("azLayout").addEventListener("click", function (e) { var b = e.target.closest(".opt"); if (!b) return; sfx.tap(); store.display.layout = b.dataset.v; save(); applyDisplay(); renderDisp(); });
  $("azReset").onclick = function () { sfx.tap(); store.display = { scale: "auto", layout: "auto" }; save(); applyDisplay(); renderDisp(); };
  $("azClose").onclick = function () { sfx.tap(); $("anzeige").classList.remove("on"); };
  $("anzeige").addEventListener("click", function (e) { if (e.target === $("anzeige")) $("anzeige").classList.remove("on"); });
  window.addEventListener("resize", applyDisplay);
  window.addEventListener("orientationchange", function () { setTimeout(applyDisplay, 200); });
  applyDisplay();

  function goHome() { location.replace("#/"); }
  $("backBtn").onclick = goHome;

  // ── Router ──
  function route() {
    var m = /^#\/t\/(\d+)/.exec(location.hash), hero = location.hash === "#/held";
    $("party").classList.remove("on"); stopFireworks();
    var cf = document.querySelectorAll(".confetti,.coinrain,.floatcoin"); for (var ci = 0; ci < cf.length; ci++) cf[ci].remove();
    $("home").classList.toggle("on", !m && !hero);
    $("read").classList.toggle("on", !!m);
    $("hero").classList.toggle("on", hero);
    if (m) { var id = +m[1]; if (!cur || cur.id !== id || st.done) openText(id); }
    else if (hero) { cur = null; sel = null; renderHero(); }
    else { cur = null; renderHome(); }
  }
  window.addEventListener("hashchange", route);
  route();
  if (!store.profile) openProfile(false);
})();
</script>
</body>
</html>
